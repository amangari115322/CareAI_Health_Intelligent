services:
  # ── 1. FASTAPI BACKEND WEB SERVICE ──────────────────────────────
  - type: web
    name: caredata-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false

  # ── 2. NEXT.JS FRONTEND WEB SERVICE ─────────────────────────────
  - type: web
    name: caredata-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: caredata-backend
          type: web
          property: host
